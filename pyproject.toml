[project]
name = "dazure"
version = "0.0.1.dev0"
description = "The Azure helpers azure-identity lacks: your az login carried into Spark, DuckDB and any Azure REST API."
readme = "README.md"
authors = [
    { name = "pedrobtz", email = "pedrobtz@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.27",
    "httpx>=0.28",
    "rich>=13",
]
keywords = ["azure", "azure-identity", "spark", "abfs", "duckdb", "oauth", "refresh-token"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]

[project.urls]
Homepage = "https://github.com/pedrobtz/py-dazure"
Documentation = "https://pedrobtz.github.io/py-dazure/"
Issues = "https://github.com/pedrobtz/py-dazure/issues"
Changelog = "https://github.com/pedrobtz/py-dazure/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".agents", ".github", "CLAUDE.md", "uv.lock", ".python-version", "typings",
    # The documentation site's sources (design §7), and the test that reads them.
    "great-docs.yml", "user_guide", "tests/test_docs_snippets.py",
    # The Petstore example, its OpenAPI fixture and their CI test: repository-only
    # (design §7). The opt-in live test stays: it is collected and skipped.
    "examples", "tests/fixtures/petstore-openapi.*", "tests/test_petstore_example.py",
]

[dependency-groups]
dev = [
    "pydantic>=2.11",
    "pyright>=1.1.414",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpbin>=2.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.6",
    "typing-extensions>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The design keeps its signatures aligned by hand; ruff formats Python files only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.pytest.ini_options]
testpaths = ["tests", "examples/tests"]
# The example tests import the example modules by name, as a user's tests import
# their installed package.
pythonpath = ["examples"]
addopts = ["-ra"]
filterwarnings = ["error"]

[tool.pyright]
# Strict over the package, the examples and the typing tests (design §8.1).
include = ["src", "examples", "tests/typing"]
# examples/tests import the example modules by name (pytest's `pythonpath`).
extraPaths = ["examples"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
