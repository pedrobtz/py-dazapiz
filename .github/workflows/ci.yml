name: CI

# Profiles (see .agents/roadmap.md, "CI policy"):
#   quick: lint + pytest on Ubuntu / Python 3.13. Pull requests.
#   full:  lint + pytest on 3 OSes x Python 3.10-3.14 (the persisted MSAL
#          cache differs by OS, design §7), lowest direct dependencies,
#          coverage, and a packaging check. Pushes to main, manual runs, and pull requests
#          labelled `full-ci`.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# A pull request's superseded runs are cancelled; a push to main never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  quick:
    if: ${{ !(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # DuckDB's azure extension is downloaded once per DuckDB version (the one
      # uv.lock, or the lowest resolution, installs) and restored from the cache.
      - name: DuckDB version
        id: duckdb
        shell: bash
        run: echo "version=$(uv run --frozen --all-extras python -c 'import duckdb; print(duckdb.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - run: uv run --frozen --all-extras pytest

  test:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS runners are scarce, so macOS runs the oldest and newest Python only.
        exclude:
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # DuckDB's azure extension is downloaded once per DuckDB version (the one
      # uv.lock, or the lowest resolution, installs) and restored from the cache.
      - name: DuckDB version
        id: duckdb
        shell: bash
        run: echo "version=$(uv run --frozen --all-extras python -c 'import duckdb; print(duckdb.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - run: uv run --frozen --all-extras pytest

  lowest:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    name: test (lowest direct dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      # Design principle 5: the base install works without the duckdb extra.
      - name: dazure imports without the duckdb extra
        run: |
          uv run --resolution lowest-direct --isolated --no-dev python -c "
          import importlib.util
          assert importlib.util.find_spec('duckdb') is None, 'duckdb is installed'
          import dazure, dazure.duckdb
          try:
              dazure.duckdb.list_secrets(None)
          except ImportError as err:
              assert 'dazure[duckdb]' in str(err), err
          else:
              raise SystemExit('dazure.duckdb ran without duckdb')
          print('dazure', dazure.__version__, 'imports without duckdb')
          "
      # DuckDB's azure extension is downloaded once per DuckDB version (the one
      # uv.lock, or the lowest resolution, installs) and restored from the cache.
      - name: DuckDB version
        id: duckdb
        shell: bash
        run: echo "version=$(uv run --resolution lowest-direct --isolated --all-extras python -c 'import duckdb; print(duckdb.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - run: uv run --resolution lowest-direct --isolated --all-extras pytest

  coverage:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # DuckDB's azure extension is downloaded once per DuckDB version (the one
      # uv.lock, or the lowest resolution, installs) and restored from the cache.
      - name: DuckDB version
        id: duckdb
        shell: bash
        run: echo "version=$(uv run --frozen --all-extras python -c 'import duckdb; print(duckdb.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      # The floor is the level Stage 8 reached (99%), less a point of slack. What
      # stays uncovered here: the Windows branch of killing az's process tree (run
      # by the Windows test legs, not measured), and installing DuckDB's azure
      # extension when the cache already has it.
      - run: uv run --frozen --all-extras pytest --cov=dazure --cov-report=term-missing --cov-fail-under=98

  package:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: sdist leaves out repository-only files
        run: |
          ! tar tzf dist/*.tar.gz | grep -E '/(\.agents|\.github)/'
      - name: the installed wheel imports
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "import dazure; print(dazure.__version__)"
